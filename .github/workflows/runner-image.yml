name: Runner image

# Publishes the Factory-Runner image (#855, R2) and signs it. Started by hand, never by a push or a schedule: publishing
# it delivers the image (with the copyleft packages of the Worker image in it) to people outside Itegro GmbH, which
# THIRD_PARTY_LICENSES.md ("Copyleft and distribution") says must be reviewed first. The run refuses without the
# confirmation input, and nothing happens until the owner has started it.
#
# What it makes, from this commit of main: the agent image (the `agent` target of runner/Dockerfile) and the runner image
# (runner/Dockerfile.factory-runner on top of the `sandbox` target, built here and not published), pushed to the
# registry by digest. The runner image is built with the agent image's digest and with this run's number as its release
# (the label `code-reviewer.runner.release`, which a runner compares with its own: it only ever goes up).
#
# Signing is keyless (cosign with this workflow's OIDC identity): no key exists to keep or lose. The certificate says
# "this workflow of this repository, from main or a tag, signed it", and that is exactly what runner/install/install.sh
# and `factory-runner update` verify (factory_runner/update.py `SIGNER`); the same check runs here before the channel
# moves, so a release that a runner would refuse never becomes `stable`. The tag `stable` is the channel a runner follows;
# it is moved last.
#
# One thing outside this file: GitHub creates the packages private. A runner on a customer's machine pulls without a
# login, so the owner sets the two packages (code-reviewer-factory-runner, code-reviewer-agent) to public once, in the
# package settings, after the first run (docs/runner.md, "Releasing the runner image").
on:
  workflow_dispatch:
    inputs:
      confirm_distribution:
        description: 'Type "reviewed" to confirm that THIRD_PARTY_LICENSES.md, "Copyleft and distribution", was reviewed for publishing the runner image'
        required: true
      move_stable:
        description: "Move the tag stable to this release, so that runners update to it"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time: two runs would race for the channel.
concurrency:
  group: runner-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUNNER_REPOSITORY: ghcr.io/itegro-gmbh/code-reviewer-factory-runner
  AGENT_REPOSITORY: ghcr.io/itegro-gmbh/code-reviewer-agent

jobs:
  publish:
    name: Build, push, sign and verify
    # Only the repository's own main: the signer identity a runner accepts is this workflow on main (or a tag).
    if: ${{ github.repository_owner == 'Itegro-GmbH' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Require the confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_distribution }}
        run: |
          if [ "$CONFIRMATION" != "reviewed" ]; then
            echo "::error::Publishing the runner image needs the review of THIRD_PARTY_LICENSES.md (Copyleft and distribution): type \"reviewed\" as confirm_distribution once it was done."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The version of runner/cosign-pin.json, the one the runner image and the installer carry.
          cosign-release: v3.1.3
      - name: Build and push the agent image
        id: agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          target: agent
          push: true
          tags: ${{ env.AGENT_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=runner-agent
          cache-to: type=gha,mode=max,scope=runner-agent
      - name: Build the Worker image the runner image is made on (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          target: sandbox
          load: true
          push: false
          tags: code-reviewer-runner-sandbox:release
          cache-from: type=gha,scope=runner-sandbox
          cache-to: type=gha,mode=max,scope=runner-sandbox
      # Built with the daemon's own builder, which sees the image above (as in ci.yml, job image-runner-sandbox).
      - name: Build the runner image
        env:
          AGENT_REF: ${{ env.AGENT_REPOSITORY }}@${{ steps.agent.outputs.digest }}
          RELEASE: ${{ github.run_number }}
        run: >-
          docker buildx build --builder default --load
          --file runner/Dockerfile.factory-runner
          --build-arg WORKER_IMAGE=code-reviewer-runner-sandbox:release
          --build-arg "AGENT_IMAGE_REF=$AGENT_REF"
          --build-arg "RUNNER_RELEASE=$RELEASE"
          --tag factory-runner:release runner
      - name: Smoke test the runner image
        run: |
          set -euo pipefail
          docker run --rm factory-runner:release --version
          docker run --rm --entrypoint cosign factory-runner:release version
          docker run --rm --entrypoint cat factory-runner:release /opt/code-reviewer/agent-image.json
      - name: Push the runner image
        id: push
        env:
          TAG: ${{ env.RUNNER_REPOSITORY }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag factory-runner:release "$TAG"
          docker push "$TAG"
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$TAG" | grep "^$RUNNER_REPOSITORY@sha256:" | head -n 1)"
          [ -n "$digest" ] || { echo "::error::the pushed image has no digest"; exit 1; }
          echo "reference=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the images (keyless)
        env:
          RUNNER_REF: ${{ steps.push.outputs.reference }}
          AGENT_REF: ${{ env.AGENT_REPOSITORY }}@${{ steps.agent.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$AGENT_REF"
          cosign sign --yes "$RUNNER_REF"
      # The check a runner makes, made here before the channel moves: factory_runner/update.py SIGNER.
      - name: Verify what a runner will verify
        env:
          RUNNER_REF: ${{ steps.push.outputs.reference }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Itegro-GmbH/code-reviewer/\.github/workflows/runner-image\.yml@refs/(heads/main|tags/.+)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_REF" > /dev/null
      - name: Move the channel
        if: ${{ inputs.move_stable }}
        env:
          RUNNER_REF: ${{ steps.push.outputs.reference }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$RUNNER_REPOSITORY:stable" "$RUNNER_REF"
          echo "stable is now $RUNNER_REF (release ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
