name: Cloudflare sandbox

# The Worker `cr-sandbox` and its Container image (#1159, epic #1157, docs/runner.md "Cloudflare placement"). One definition, three callers:
#   * ci.yml, for a pull request that changes what the image is made of (the `cloudflare` filter): the Worker's tests, and the whole image
#     BUILT AND RUN once (never pushed, never deployed, no secret): the two images of the Worker and the agent, the Container image on top of
#     them, the real boot of it on the runner (vm-prepare.sh, `docker load` of both archives, the tags) and a dry run of the deployment. The image is
#     proven before it is merged; it is never built on a developer machine (the server has 2 GB of RAM to spare and 9 GB of disk).
#   * a push to main, which is part of the release: the same, then `wrangler deploy` (the build of the Container image and its push to Cloudflare's
#     registry are wrangler's) and the Worker secret `CF_SANDBOX_TOKEN`;
#   * by hand (`workflow_dispatch`): the same as a push on main, and a rehearsal (build only) on any other branch.
# The deployment needs three repository secrets that the owner sets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the account "Itegro GmbH") and
# CF_SANDBOX_TOKEN (the bearer token of the API, at least 32 characters; the Dispatcher's CF_SANDBOX_TOKEN is the same value). The first step of a
# deployment fails with a message that names the missing ones, before anything is built. Everything it touches in the account is named cr-sandbox*
# (cloudflare/sandbox/wrangler.jsonc, held by a test); it never touches the spike's cr-spike-* or the other apps of the account.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: "cr-sandbox: types, tests, format"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/sandbox/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: cloudflare/sandbox/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Types, tests and format
        run: pnpm verify

  image:
    name: "cr-sandbox: build and run the image, deploy on main"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # A deployment: a push to main or a run by hand on main, in this repository only (the old name of the repository must not deploy). Anything else
      # builds, runs and dry-runs the image and stops there.
      DEPLOY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'Itegro-GmbH/code-reviewer' }}
    steps:
      - name: Check the Cloudflare secrets (a deployment only)
        if: ${{ env.DEPLOY == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SANDBOX_TOKEN: ${{ secrets.CF_SANDBOX_TOKEN }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$CF_SANDBOX_TOKEN" ] || missing+=(CF_SANDBOX_TOKEN)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Cloudflare secrets missing::The repository secrets ${missing[*]} are not set. The owner sets them (docs/runner.md, Cloudflare placement); nothing was built or deployed."
            exit 1
          fi
          if [ "${#CF_SANDBOX_TOKEN}" -lt 32 ]; then
            echo "::error title=CF_SANDBOX_TOKEN too short::The bearer token of the cf-sandbox API must have at least 32 characters; nothing was built or deployed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/sandbox/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: cloudflare/sandbox/pnpm-lock.yaml
      # The runner's 14 GB are not enough for the two images, their archives, the Container image and the self-check's copy of the engine's store.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install wrangler
        working-directory: cloudflare/sandbox
        run: pnpm install --frozen-lockfile
      # The golden snapshot's recipe as data, from the Dispatcher's own code; nothing in the image repeats a version.
      - name: Prepare the image context
        run: cloudflare/sandbox/image/prepare-context.sh
      - name: Build the Worker and agent images
        run: cloudflare/sandbox/image/build-inner.sh
      - name: Build the Container image
        run: docker build --file cloudflare/sandbox/image/Dockerfile --tag cr-sandbox-image:ci cloudflare/sandbox/image
      # The real boot: vm-prepare.sh, `docker load` of both archives, the tags, the daemon stopped; and what /health publishes (features, image ids).
      - name: Run the image
        run: cloudflare/sandbox/image/self-check.sh cr-sandbox-image:ci "$RUNNER_TEMP/image.env"
      # The configuration is proven without the account: wrangler builds the image again from the cached layers and describes the deployment.
      - name: Dry run of the deployment
        if: ${{ env.DEPLOY != 'true' }}
        working-directory: cloudflare/sandbox
        run: pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
      - name: Deploy the Worker
        if: ${{ env.DEPLOY == 'true' }}
        working-directory: cloudflare/sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # WORKER_FEATURES, WORKER_IMAGE_ID and AGENT_IMAGE_ID: what the self-check read from the images themselves.
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/image.env"
          pnpm exec wrangler deploy \
            --var "IMAGE_VERSION:$GITHUB_SHA" \
            --var "WORKER_FEATURES:$WORKER_FEATURES" \
            --var "WORKER_IMAGE_ID:$WORKER_IMAGE_ID" \
            --var "AGENT_IMAGE_ID:$AGENT_IMAGE_ID"
      # After the deploy: until it is set the Worker answers 401 to everything (fail closed).
      - name: Set the Worker secret
        if: ${{ env.DEPLOY == 'true' }}
        working-directory: cloudflare/sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SANDBOX_TOKEN: ${{ secrets.CF_SANDBOX_TOKEN }}
        run: printf '%s' "$CF_SANDBOX_TOKEN" | pnpm exec wrangler secret put CF_SANDBOX_TOKEN
      - name: Show the result
        run: |
          {
            echo "### cr-sandbox image"
            echo
            echo "- image version: \`$GITHUB_SHA\`"
            echo "- deployed: \`$DEPLOY\`"
            sed 's/^/- /' "$RUNNER_TEMP/image.env"
          } >> "$GITHUB_STEP_SUMMARY"
