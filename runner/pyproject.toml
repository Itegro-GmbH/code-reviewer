[project]
name = "code-reviewer-runner"
version = "0.1.0"
description = "Worker that picks up review jobs from the Code Reviewer app and runs PR-Agent."
requires-python = ">=3.13"
license = { text = "Proprietary" }
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pr-agent==0.47.0",
    # The network door's certificate authority for the package registries (#784); pr-agent pulls it
    # in through azure-identity, and the door must not depend on that staying so.
    "cryptography>=50.0.2",
]

[project.scripts]
code-reviewer-runner = "code_reviewer_runner.cli:main"
code-reviewer-run-job = "code_reviewer_runner.runner:main"
code-reviewer-worker = "code_reviewer_runner.worker_cli:main"
worker-reap = "code_reviewer_runner.worker_reap:main"
factory-runner = "code_reviewer_runner.factory_runner.cli:entry_point"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_reviewer_runner"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket",
    "pytest-timeout",
    "pytest-xdist",
    "ruff",
    "pyright",
    "jsonschema",
    "pyjwt>=2.15.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Network guard: only loopback is reachable. Unix sockets stay allowed (asyncio needs them).
# engine tests (the real PR-Agent against loopback fakes), privileged tests (root, the dedicated
# engine user, nft) and lane tests (a whole Implementer turn on a real Docker daemon) are deselected
# unless asked for with -m engine / -m privileged / -m lane. kvm tests (a job in a Firecracker VM, #978) need
# /dev/kvm and the VM artifacts: they run only in the KVM lane of .github/workflows/vm-artifacts.yml.
addopts = [
    "--strict-markers",
    "--disable-socket",
    "--allow-unix-socket",
    "--allow-hosts=127.0.0.1,::1,localhost",
    "-m",
    "not engine and not privileged and not lane and not kvm",
]
filterwarnings = [
    # pytest-socket warns about every blocked connection; the tests assert the block themselves.
    "ignore:A test tried to use socket.socket.connect\\(\\):UserWarning",
    # Raised while PR-Agent itself is imported; not ours to fix.
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning",
]
markers = [
    "unit: pure logic on the host, no real process or network (default level)",
    "integration: real processes or real sockets on loopback",
    "contract: pins the runner API and webhook shapes against the shared contract files",
    "engine: real PR-Agent against the loopback fakes (deselected by default)",
    "smoke: the few engine tests that prove the runner end to end (run with -m \"engine and smoke\", #713)",
    "privileged: root with the production capabilities, the dedicated engine user and nft (deselected by default)",
    "lane: a whole Implementer turn on a real Docker daemon, as root, with the images (deselected by default, #745)",
    "kvm: a job in a real Firecracker VM started by the local Dispatcher's launcher (KVM and the VM artifacts; deselected by default, #978)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The fixed core is a prompt asset embedded in code (#198): each rule is a single logical line, so
# its physical lines are intentionally longer than the lint limit.
"src/code_reviewer_runner/dynamic_review/prompt_core.py" = ["E501"]
# The attack test's table: the expected denial of each check is one sentence on one line (#745, step 6).
"scripts/sandbox_boundary_check.py" = ["E501"]
# The network door's lane: the embedded server and client programs and the sentences that say what each check proves (#745, step 7).
"tests/lane/test_network_door.py" = ["E501"]
# The stand-ins of the installer's tests (#982) are shell programs in strings.
"tests/unit/host_install_support.py" = ["E501"]
# The spikes of the Factory-Runner (#853): the embedded programs (the MCP server, the command) and the sentences that say what a check proves.
"scripts/runner_spikes.py" = ["E501"]

[tool.pyright]
include = ["src", "tests", "scripts", "../fakes"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = ["src", "..", "tests/engine", "tests/kvm", "tests/unit"]
venvPath = "."
venv = ".venv"

# The follow-up spike (#837) drives the lane's helpers from a script, as the lane's tests do.
[[tool.pyright.executionEnvironments]]
root = "scripts"
extraPaths = ["src", "..", "tests", "tests/engine", "tests/lane", "tests/kvm"]
